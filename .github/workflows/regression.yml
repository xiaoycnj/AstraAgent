name: Windows regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-regression:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Core execution and security tests
        shell: pwsh
        run: |
          $suites = @(
            'test_agent_runtime.py', 'test_app.py', 'test_attachments.py', 'test_cli_render.py', 'test_context_oauth.py',
            'test_conversation_modes.py', 'test_create_file.py', 'test_creative_workflows.py',
            'test_durable_execution.py', 'test_extension_safety.py', 'test_image_generation.py',
            'test_image_message_state.py', 'test_intelligent_ui.py', 'test_marketplace_author.py',
            'test_performance_stats.py', 'test_personalization.py', 'test_security.py',
            'test_comprehensive_security.py', 'test_stream_journal.py', 'test_usage_meter.py',
            'test_web_search.py'
          )
          foreach ($suite in $suites) {
            python -m unittest discover -s tests -p $suite -q
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Browser workflows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work | Out-Null
          npm install --prefix "$env:RUNNER_TEMP/astra-ui" --ignore-scripts --no-audit --no-fund playwright@1.56.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PLAYWRIGHT_MODULE = "$env:RUNNER_TEMP/astra-ui/node_modules/playwright"
          $env:ASTRA_TEST_PYTHON = (Get-Command python).Source
          $env:ASTRA_TEST_BROWSER = 'C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe'
          if (!(Test-Path -LiteralPath $env:ASTRA_TEST_BROWSER)) { throw 'Microsoft Edge is required for the browser gate' }
          $suites = @(
            'image_inline_state', 'image_stream_callbacks', 'browser_first_run', 'browser_windows',
            'browser_canvas_workspace', 'browser_creative', 'browser_security', 'browser_rich_chat', 'browser_personalization',
            'browser_performance', 'browser_layout', 'browser_intelligent_ui', 'browser_conversation_modes',
            'browser_motion', 'browser_controls', 'browser_extension_recovery', 'browser_image_inline', 'browser_attachments'
          )
          foreach ($suite in $suites) {
            node "tests/$suite.cjs"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
