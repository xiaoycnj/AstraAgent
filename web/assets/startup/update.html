<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AstraAgent Update</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{color:#252735;background:#fafbfe;font:14px "Segoe UI","Microsoft YaHei UI",sans-serif}body:before{content:"";position:absolute;width:390px;height:390px;right:-170px;top:-230px;background:conic-gradient(#7973ff,#ff9268,#f0bcf9,#89d4ff,#7973ff);filter:blur(24px);border-radius:45%;animation:spin 16s linear infinite;pointer-events:none}.card{height:100%;display:flex;flex-direction:column;gap:12px;padding:32px 36px;position:relative;border:1px solid #ffffffa0;border-radius:24px;overflow:hidden}.eyebrow{font-size:11px;letter-spacing:1.2px;color:#71778c}h1{font-size:30px;font-weight:600;letter-spacing:-1px;margin:13px 0 0}.tagline{margin:0;color:#7d8394;font-size:13px}footer{margin-top:auto;min-height:0;display:flex;flex-direction:column;gap:12px}progress{display:block;width:100%;height:4px;accent-color:#8272ed;flex-shrink:0}#status{font-size:12px;line-height:1.65;margin:0;overflow-wrap:anywhere;max-height:60px;overflow:auto}details{font-size:11px;color:#72798b;max-height:64px;overflow:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;margin:5px 0}summary{cursor:pointer}.close{position:absolute;right:14px;top:12px;border:0;background:#ffffff80;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:#53596f}.close[hidden]{display:none}.close svg{width:13px;height:13px}body.failed progress{display:none}body.failed:before{animation:none}body.failed #status{color:#a54a52}body.failed .card{gap:9px}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){body:before{animation:none}}
