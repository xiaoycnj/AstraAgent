<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AstraAgent · 更新</title>
  <link rel="stylesheet" href="window.css">
  <script src="window.js" defer></script>
</head>
<body data-window="update" data-phase="waiting">
  <main class="card">
    <header class="titlebar pywebview-drag-region">
      <span class="identity pywebview-drag-region"><img class="brand pywebview-drag-region" src="astra.svg" alt="" width="23" height="23">AstraAgent</span>
      <button id="close" class="close" type="button" data-action="close" aria-label="关闭" title="关闭" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </header>
    <div class="intro">
      <h1 data-label="caption">软件更新</h1>
      <p class="tagline" id="update-version" data-label="subtitle">正在准备更新</p>
    </div>
    <footer>
      <ol class="steps" aria-label="更新步骤">
        <li data-step="waiting" aria-current="step" data-label="waiting">准备</li>
        <li data-step="download" data-label="download">下载</li>
        <li data-step="install" data-label="install">安装</li>
        <li data-step="restart" data-label="restart">重启</li>
      </ol>
      <div class="status-line">
        <p id="status" role="status">正在等待主面板与后台服务退出…</p>
        <span id="amount" aria-hidden="true" hidden></span>
      </div>
      <div class="meter"><progress aria-label="下载进度"></progress></div>
      <details id="error-details" hidden>
        <summary data-label="details">查看错误详情</summary>
        <pre id="error-text" tabindex="0"></pre>
      </details>
    </footer>
  </main>
</body>
</html>
