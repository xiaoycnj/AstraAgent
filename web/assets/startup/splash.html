<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AstraAgent</title>
  <link rel="stylesheet" href="window.css">
  <script src="window.js" defer></script>
</head>
<body data-window="startup" data-phase="waiting">
  <main class="card">
    <header class="titlebar pywebview-drag-region">
      <span class="identity pywebview-drag-region" data-label="caption">启动</span>
      <button class="close" type="button" data-action="cancel_startup" aria-label="取消启动" title="取消启动">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </header>
    <div class="intro startup-intro">
      <div>
        <h1>AstraAgent</h1>
        <p class="tagline" data-label="subtitle">正在准备工作空间</p>
      </div>
      <img class="launch-mark" src="astra.svg" alt="" width="72" height="72">
    </div>
    <footer>
      <div class="status-line">
        <p id="status" role="status">正在唤醒工作空间</p>
        <p id="version" class="meta">VERSION 3.19.0</p>
      </div>
      <div class="meter"><progress aria-label="启动进度"></progress></div>
      <button class="retry" type="button" data-action="retry" hidden>重新连接</button>
    </footer>
  </main>
</body>
</html>
